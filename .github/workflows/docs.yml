name: docs

# Builds the documentation site (docs-site/, VitePress over the repo's own markdown), the
# serverless viewer and the Cirro app, and publishes all three to GitHub Pages. The demo
# checkpoints are committed under docs-site/viewer-data/ (and the app's own example under
# cirro-studio/examples/), so this job never downloads data and never needs Cirro
# credentials — refresh them with scripts/fetch_example_checkpoints.py and
# scripts/prepare_studio_example.py and commit the result.
#
# Pages must be enabled once by hand: Settings -> Pages -> Source = GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merged PR always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build the viewer SPA
        # vite.config.ts sets base './', so the same build works under /viewer/.
        run: npm run build

      - name: Build the Cirro app
        run: npm run build:studio

      - name: Check the Cirro app's tenants
        # Every tenant needs an id and an https origin; the app asks each for its client ID
        # by callback URL, so an entry carries one only for a registration without discovery.
        run: |
          node -e '
            const { tenants } = JSON.parse(require("fs").readFileSync("cirro-studio/deploy/tenants.json", "utf8"));
            for (const t of tenants) {
              if (!t.id || !/^https:\/\/[^/]+$/.test(t.url)) throw new Error(`bad tenant ${JSON.stringify(t)}`);
            }'

      - name: Build the docs site
        run: npm run docs:build

      - name: Assemble the Pages tree
        # /viewer/ ends up a valid standalone deployment in its own right (DESIGN §14.3):
        # index.html + assets + index.json + the .zarr.zip files in one directory, which
        # is what makes it browsable as a collection as well as embeddable per page.
        run: |
          cp -r frontend/dist docs-site/.vitepress/dist/viewer
          cp docs-site/viewer-data/* docs-site/.vitepress/dist/viewer/
          # The Cirro app at /app/: its examples beside it (the index also names the
          # demo checkpoints at ../../viewer/), and the deployed tenants in place of the
          # development one.
          cp -r cirro-studio/dist docs-site/.vitepress/dist/app
          cp -r cirro-studio/examples docs-site/.vitepress/dist/app/examples
          cp cirro-studio/deploy/tenants.json docs-site/.vitepress/dist/app/tenants.json
          mkdir -p docs-site/.vitepress/dist/docs
          cp -r docs/images docs-site/.vitepress/dist/docs/images

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    # PRs build (so a broken site fails review) but only main publishes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
