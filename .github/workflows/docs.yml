name: docs

# Builds the Cirro app, the documentation site (docs-site/, VitePress over the repo's own
# markdown) and the serverless viewer, and publishes all three to GitHub Pages: the app at
# the site's root, the docs as its About section at /about/, the viewer at /viewer/. The demo
# checkpoints are committed under docs-site/viewer-data/ (and the app's own example under
# cirro-studio/examples/), so this job never downloads data and never needs Cirro
# credentials — refresh them with scripts/fetch_example_checkpoints.py and
# scripts/prepare_studio_example.py and commit the result.
#
# Pages must be enabled once by hand: Settings -> Pages -> Source = GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merged PR always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build the viewer SPA
        # vite.config.ts sets base './', so the same build works under /viewer/.
        run: npm run build

      - name: Build the Cirro app
        run: npm run build:studio

      - name: Check the Cirro app's tenants
        # Every tenant needs an id and an https origin; the app asks each for its client ID
        # by callback URL, so an entry carries one only for a registration without discovery.
        run: |
          node -e '
            const { tenants } = JSON.parse(require("fs").readFileSync("cirro-studio/deploy/tenants.json", "utf8"));
            for (const t of tenants) {
              if (!t.id || !/^https:\/\/[^/]+$/.test(t.url)) throw new Error(`bad tenant ${JSON.stringify(t)}`);
            }'

      - name: Build the docs site
        run: npm run docs:build

      - name: Assemble the Pages tree
        # The Cirro app is the site's root, with its examples beside it and the deployed
        # tenants in place of the development one. The docs site is the About section,
        # under /about/. /viewer/ ends up a valid standalone deployment in its own right
        # (DESIGN §14.3): index.html + assets + index.json + the .zarr.zip files in one
        # directory, which is what makes it browsable as a collection as well as
        # embeddable per page; the app's example index names those demo checkpoints at
        # ../viewer/ rather than copying them.
        run: |
          cp -r cirro-studio/dist site
          cp -r cirro-studio/examples site/examples
          cp cirro-studio/deploy/tenants.json site/tenants.json
          cp -r docs-site/.vitepress/dist site/about
          mkdir -p site/about/docs
          cp -r docs/images site/about/docs/images
          cp -r frontend/dist site/viewer
          cp docs-site/viewer-data/* site/viewer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # PRs build (so a broken site fails review) but only main publishes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
