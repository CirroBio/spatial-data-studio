# Build + test gate for PRs and pushes to main.
#
# Backend job runs the full in-process round trip (backend/test_e2e.py), including
# the snapshot save/open flow. Frontend job lints the React hooks rules, then
# typechecks and builds the canvas library and the app. Nextflow job lints the
# workflows (CLAUDE.md requires a clean report).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches .venv-introspect (README "Run locally")

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.16" # matches docker/Dockerfile and the local dev venv
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install backend deps
        # Exactly the README/run.sh setup: install pinned deps, then strip the GPL
        # Leiden backends (custom.leiden uses graspologic-native instead).
        run: |
          uv pip install --system -r backend/requirements.txt
          uv pip uninstall --system leidenalg igraph

      - name: Prepare test dataset
        # CI runs the Visium-backed portion of test_e2e.py. The Xenium flows
        # (segmentation/raster/zarr-import/custom methods) need the larger
        # xenium.zarr + xenium_tma.zarr fixtures and are skipped when absent;
        # regenerate them locally via scripts/prepare_xenium_*.py (see
        # DEVELOPMENT.md "Test datasets") to run the full suite.
        run: python scripts/prepare_test_data.py

      - name: Backend round-trip
        # Script-style test (no pytest collection): the repo's canonical backend check.
        run: |
          cd backend
          PYTHONPATH=. python test_e2e.py

  nextflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # Nextflow 25.x requires 17+

      - name: Install Nextflow
        # Pinned: the linter ships with Nextflow, so an unpinned version would let a
        # new upstream rule fail an unrelated PR.
        env:
          NXF_VER: "25.10.4"
        # Installed outside the checkout: the installer writes a file named `nextflow`
        # into the working directory, which collides with the repo's `nextflow/` tree.
        working-directory: ${{ runner.temp }}
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Lint workflows
        # `nextflow lint` exits non-zero on errors but 0 on warnings, and the warnings
        # are deprecations that become errors in a later release — fail on either, so
        # the report stays clean rather than accumulating them.
        run: |
          nextflow lint nextflow/ 2>&1 | tee lint.log
          if grep -q 'Warn' lint.log; then
            echo "::error::nextflow lint reported warnings; see the log above"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the data-type catalog
        # The catalog, its schema, nextflow.config and nextflow_schema.json have to
        # agree, and nothing at runtime would notice if they stopped. Also runs
        # discovery over a synthetic tree of every catalogued type.
        run: |
          pip install --quiet jsonschema
          python nextflow/tests/check_catalog.py
        # Deliberately not run here: nextflow/tests/check_containers.py, which asserts
        # every container image provides `ps`. It has to pull the images (~2.4 GB) to
        # look inside them, which would make this job the slowest in CI and tie every
        # PR to a registry being up. Run it by hand when changing an image — see
        # nextflow/README.md.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, lint, typecheck, build
        # One npm workspace: packages/viewer (@cirrobio/spatial-viewer) then frontend.
        #
        # `npm run lint` is the React hooks rules only (eslint.config.mjs).
        # rules-of-hooks is an error and the tree is clean of it, so a new violation
        # fails the job. exhaustive-deps is a warning: eight pre-existing ones remain,
        # and eslint exits 0 on warnings, so this does not fail CI today. Once those
        # are cleared, raise the rule to 'error' — or add `-- --max-warnings 0` here —
        # to make the dependency-array check enforcing.
        run: |
          npm ci
          npm run lint
          npm run typecheck -w @cirrobio/spatial-viewer
          npx tsc --noEmit -p frontend/tsconfig.app.json
          npm run test -w spatial-data-studio-frontend
          npm run build
