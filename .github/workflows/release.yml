name: release

# Attaches two build outputs to a release, neither of which lives in the repository:
#
# - viewer-dist.tar.gz — the built viewer SPA, which the workflow's --viewer_dist points
#   at by default. `frontend/dist` is gitignored, so a fresh clone carries no build and a
#   run launched straight from the repository — how Cirro runs it — has no other way to
#   obtain one.
# - cirrobio-spatial-viewer-<version>.tgz — the @cirrobio/spatial-viewer library, so
#   Cirro-components can depend on a tagged artifact instead of a path into a checkout
#   sitting beside it. The SPA archive cannot serve that purpose: it is a bundled site
#   with no package manifest, entry points or type declarations.
on:
  push:
    tags: ["v*"]
  # Attach the asset to a tag that was released before this job existed, or re-attach
  # after a failed upload.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the viewer from
        required: true

permissions:
  contents: write

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # matches ci.yml and docs.yml
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the viewer SPA
        # Same build the docs site publishes: packages/viewer then frontend.
        run: |
          npm ci
          npm run build

      - name: Pack the viewer SPA
        # Contents at the archive root rather than under a dist/ prefix, so
        # PUBLISH_VIEWER unpacks it straight into the site directory.
        run: tar -czf viewer-dist.tar.gz -C frontend/dist .

      - name: Pack the viewer library
        # Stamped with the tag's version so the artifact never reports a version other
        # than the release it shipped in — the package's own version is otherwise only
        # bumped by hand, and a URL dependency is pinned by tag, not by that field.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          npm version --no-git-tag-version --allow-same-version \
            --workspaces-update=false "${TAG#v}" -w @cirrobio/spatial-viewer
          # The license lives at the repo root, and npm can only pack files from inside
          # the package, so the tarball would otherwise ship none.
          cp LICENSE.md packages/viewer/
          npm pack -w @cirrobio/spatial-viewer --pack-destination .

      - name: Attach them to the release
        # A tag push usually arrives before the release exists, so create it if needed.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" viewer-dist.tar.gz \
            "cirrobio-spatial-viewer-${TAG#v}.tgz" --clobber
